name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-agent/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Java, Android SDK and Gradle
        run: |
          java -version
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0|platform-tools' || true
          gradle --version

      - name: Clean and build debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-debug-apk
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android-agent/app/build/reports/**
            android-agent/app/build/outputs/logs/**
          if-no-files-found: ignore
